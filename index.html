<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FLUFFY | Professional UI Studio</title>
<meta name="referrer" content="no-referrer">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A==" crossorigin="anonymous" referrerpolicy="no-referrer" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Syne:wght@700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">

<style>
:root {
  --bg: #030304;
  --text: #ffffff;
  --text-muted: #71717a;
  --border: rgba(255, 255, 255, 0.08);
  --card-bg: rgba(5, 5, 6, 0.6);
  --green-neon: #00ff66;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; background-color: var(--bg); }
body {
  font-family: 'Inter', sans-serif;
  background-color: var(--bg);
  color: var(--text);
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
  position: relative;
}

/* YÜKLEDİĞİN ARKAPLAN RESMİ */
body::before {
  content: '';
  position: fixed; inset: 0;
  background-image: url('arkaplan.jpg');
  background-size: cover;
  background-position: center;
  opacity: 0.25; 
  z-index: -2;
  pointer-events: none;
}

/* ARKA PLAN SPOT IŞIKLARI */
.glow-bg-1 {
  position: fixed; top: -10%; left: -10%; width: 50vw; height: 50vw;
  background: radial-gradient(circle, rgba(120, 0, 255, 0.18) 0%, rgba(0,0,0,0) 70%);
  filter: blur(90px); pointer-events: none; z-index: -1;
}
.glow-bg-2 {
  position: fixed; bottom: 10%; right: -5%; width: 45vw; height: 45vw;
  background: radial-gradient(circle, rgba(0, 240, 255, 0.12) 0%, rgba(0,0,0,0) 70%);
  filter: blur(110px); pointer-events: none; z-index: -1;
}

.bg-overlay {
  position: fixed; inset: 0;
  background: linear-gradient(180deg, rgba(3, 3, 4, 0.5) 0%, rgba(3, 3, 4, 0.95) 100%);
  z-index: 0; pointer-events: none;
}

#app-view { z-index: 5; position: relative; }

/* NAVBAR */
nav { position: fixed; top: 0; width: 100%; z-index: 1000; padding: 24px 0; transition: all 0.3s ease; }
nav.scrolled { background: rgba(3, 3, 4, 0.85); border-bottom: 1px solid var(--border); padding: 14px 0; backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); }
.nav-container { max-width: 1100px; margin: 0 auto; padding: 0 24px; display: flex; justify-content: space-between; align-items: center; }

.logo { display: flex; align-items: center; gap: 12px; text-decoration: none; font-family: 'Syne', sans-serif; font-size: 20px; font-weight: 800; text-transform: uppercase; }
.logo .logo-img-wrapper { width: 36px; height: 36px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.15); background-color: #111; overflow: hidden; }
.logo .logo-img-wrapper img { width: 100%; height: 100%; object-fit: cover; }
.logo span { color: #fff; letter-spacing: -0.5px; }

.nav-links { display: flex; list-style: none; gap: 32px; align-items: center; }
.nav-links a { color: var(--text-muted); text-decoration: none; font-size: 13px; font-weight: 500; transition: color 0.2s; }
.nav-links a:hover { color: #fff; }

.badge-neon {
  display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 6px;
  font-family: 'Space Grotesk', sans-serif; font-size: 11px; font-weight: 700;
  background: rgba(0, 255, 102, 0.05); color: var(--green-neon); border: 1px solid rgba(0, 255, 102, 0.15); text-transform: uppercase;
}
.badge-neon span { width: 6px; height: 6px; background: var(--green-neon); border-radius: 50%; box-shadow: 0 0 8px var(--green-neon); }

/* CHROMATIC HERO BANNER */
.top-showcase-banner {
  width: 100%; max-width: 1100px; margin: 120px auto 30px;
  border-radius: 16px; overflow: hidden; border: 1px solid var(--border);
  height: 440px; box-shadow: 0 40px 80px rgba(0,0,0,0.7);
  display: flex; position: relative; background: #000;
}
.chrome-half { flex: 1; height: 100%; display: flex; align-items: center; overflow: hidden; position: relative; }
.chrome-half.left-grid {
  background-color: #ededed;
  background-image: linear-gradient(45deg, #e0e0e0 25%, transparent 25%), linear-gradient(-45deg, #e0e0e0 25%, transparent 25%), linear-gradient(45deg, transparent 75%, #e0e0e0 75%), linear-gradient(-45deg, transparent 75%, #e0e0e0 75%);
  background-size: 20px 20px; background-position: 0 0, 0 10px, 10px -10px, -10px 0;
  justify-content: flex-end;
}
.chrome-half.right-plain { background: #070708; justify-content: flex-start; }
.chrome-huge-text {
  font-family: 'Syne', sans-serif; font-size: clamp(30px, 5.5vw, 68px); font-weight: 800;
  line-height: 0.9; text-transform: uppercase; letter-spacing: -2px; position: absolute; width: 200%; text-align: center;
}
.left-grid .chrome-huge-text { color: #000; left: 0; }
.right-plain .chrome-huge-text {
  left: -100%; background: linear-gradient(135deg, #ff0055, #00ffaa, #00bcff, #ff0055);
  background-size: 300% 300%; -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  background-clip: text; animation: chromeGradientFlow 4s ease infinite;
}
@keyframes chromeGradientFlow {
  0% { background-position: 0% 50%; filter: brightness(1.2); }
  50% { background-position: 100% 50%; filter: brightness(1.5); }
  100% { background-position: 0% 50%; filter: brightness(1.2); }
}

/* BENTO KARTLAR */
.bento-card {
  background: var(--card-bg); border: 1px solid var(--border); border-radius: 14px;
  position: relative; backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
  transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
}
.bento-card:hover { border-color: rgba(255, 255, 255, 0.18); transform: translateY(-2px); box-shadow: 0 15px 35px rgba(0,0,0,0.6); }

.hero-mini { max-width: 650px; margin: 35px auto 45px; text-align: center; padding: 0 24px; }
.hero-bio { font-size: 15px; color: var(--text-muted); line-height: 1.6; margin-bottom: 24px; font-weight: 400; }
.btn-group { display: flex; gap: 12px; justify-content: center; }
.btn { display: inline-flex; align-items: center; padding: 12px 28px; border-radius: 6px; font-size: 13px; font-weight: 600; text-decoration: none; transition: all 0.2s; font-family: 'Space Grotesk', sans-serif; }
.btn.primary { background: #fff; color: #000; }
.btn.primary:hover { background: #e4e4e7; transform: translateY(-1px); }
.btn.secondary { background: transparent; color: #fff; border: 1px solid var(--border); }
.btn.secondary:hover { background: rgba(255,255,255,0.04); border-color: #fff; }

section { max-width: 1100px; margin: 0 auto; padding: 50px 24px; position: relative; z-index: 2; }
.section-title { font-family: 'Syne', sans-serif; font-size: 14px; font-weight: 800; color: #fff; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 24px; }
.portfolio-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 24px; }
.project-card { padding: 14px; cursor: pointer; display: flex; flex-direction: column; }
.project-img-wrapper { position: relative; width: 100%; padding-top: 56.25%; overflow: hidden; border-radius: 8px; background: #0b0b0d; border: 1px solid rgba(255,255,255,0.03); }
.project-img-wrapper img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transition: transform 0.4s ease; }
.project-card:hover .project-img-wrapper img { transform: scale(1.02); }
.project-meta { padding: 12px 4px 2px; display: flex; justify-content: space-between; align-items: center; font-family: 'Space Grotesk', sans-serif; }
.project-name { font-size: 14px; font-weight: 600; color: #fff; }

.project-action { font-size: 12px; color: var(--text-muted); text-transform: uppercase; font-weight: 700; display: flex; align-items: center; gap: 6px; }
.project-action::after { content: ' ↗'; font-family: 'Inter', sans-serif; font-size: 14px; display: inline-block; transition: transform 0.2s; }
.project-card:hover .project-action::after { transform: translate(2px, -2px); color: #fff; }

/* FİYATLANDIRMA */
.rates-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 24px; }
.rate-card { padding: 36px; }
.rate-label { font-family: 'Space Grotesk', sans-serif; font-size: 11px; text-transform: uppercase; color: var(--text-muted); letter-spacing: 1px; font-weight: 700; }
.rate-value { font-family: 'Syne', sans-serif; font-size: 30px; font-weight: 800; color: #fff; margin: 10px 0; }
.rate-info { font-size: 13px; color: var(--text-muted); line-height: 1.5; }

/* PREVIEW MODAL */
#spin-modal {
  display: none; position: fixed; inset: 0; z-index: 9999; background: rgba(2, 2, 3, 0.96);
  backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px); align-items: center; justify-content: center; flex-direction: column; padding: 24px;
}
#spin-modal.open { display: flex; }
#modal-canvas { width: 100%; max-width: 800px; aspect-ratio: 16/9; border-radius: 12px; overflow: hidden; border: 1px solid var(--border); background: #000; }
#modal-img { width: 100%; height: 100%; object-fit: cover; }
.modal-close { margin-top: 20px; background: none; border: 1px solid var(--border); color: #fff; padding: 10px 22px; border-radius: 4px; font-family: 'Space Grotesk', sans-serif; font-size: 12px; cursor: pointer; }
.modal-close:hover { background: #fff; color: #000; }

.brand-signature {
  font-family: 'Syne', sans-serif; font-size: 16px; font-weight: 800; margin-top: 40px; text-transform: uppercase;
  color: #fff; letter-spacing: 1px; opacity: 0.9;
}

@media(max-width: 768px) {
  .nav-links { display: none; }
  .portfolio-grid, .rates-grid { grid-template-columns: 1fr; gap: 16px; }
  .top-showcase-banner { height: 260px; }
}
</style>
</head>
<body>

<div class="glow-bg-1"></div>
<div class="glow-bg-2"></div>
<div class="bg-overlay"></div>

<div id="spin-modal">
  <div id="modal-canvas"><img id="modal-img" src="" alt="preview"></div>
  <button class="modal-close" onclick="closeModal()">Close System Preview</button>
</div>

<div id="app-view">

  <nav id="navbar">
    <div class="nav-container">
      <a href="#home"
