<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>m1sly | UI Designer</title>
    <link href="https://fonts.googleapis.com/css2?family=Creepster&family=Special+Elite&family=Bangers&family=Permanent+Marker&family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        :root { --bg: #030303; --accent: #ff3e3e; }

        /* Gojo Cursor */
        body, a, button { cursor: url('cursor.ani'), auto !important; }

        body { 
            background: #000; color: #fff; 
            font-family: 'Inter', sans-serif;
            background-image: url('arkaplan.jpg');
            background-size: cover;
            background-attachment: fixed;
            margin: 0;
        }

        .overlay { background: rgba(0,0,0,0.6); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        
        /* O "sade ve temiz" kutu yapısı */
        .container { 
            width: 100%; max-width: 600px; 
            background: rgba(255, 255, 255, 0.05); 
            backdrop-filter: blur(20px); 
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 40px; 
            border-radius: 0; /* Linkteki gibi keskin köşeler */
        }
        
        h1, h2 { font-family: 'Permanent Marker', cursive; text-transform: uppercase; margin-bottom: 20px; }
        
        p, li { font-size: 14px; opacity: 0.9; line-height: 1.6; }
        
        .section { margin-bottom: 30px; }
        
        .socials { display: flex; gap: 15px; margin-top: 20px; }
        .socials a { color: #fff; font-size: 20px; transition: 0.3s; }
        .socials a:hover { color: var(--accent); }
    </style>
</head>
<body>

<div class="overlay">
    <div class="container">
        <h1>m1sly | UI Designer</h1>
        
        <div class="section">
            <p><b>Role:</b> UI Designer<br><b>Payment:</b> Robux (Per Task)</p>
        </div>

        <div class="section">
            <h2>Pricing</h2>
            <p>• General work: 2,000 – 5,000 Robux</p>
            <p>• Simple tasks: 500 – 1,000 Robux</p>
        </div>

        <div class="section">
            <h2>About</h2>
            <p>Clean, clear, and in-game friendly user interfaces. Focus on layout, readability, and usability.</p>
        </div>

        <div class="section">
            <h2>Contact</h2>
            <div class="socials">
                <a href="https://discord.com" target="_blank"><i class="fab fa-discord"></i></a>
                <a href="https://twitter.com" target="_blank"><i class="fab fa-x-twitter"></i></a>
            </div>
        </div>
    </div>
</div>

<script>
    const fonts = ['Permanent Marker', 'Bangers', 'Special Elite', 'Creepster'];
    setInterval(() => {
        const randomFont = fonts[Math.floor(Math.random() * fonts.length)];
        document.querySelectorAll('h1, h2').forEach(el => {
            el.style.fontFamily = randomFont;
        });
    }, 3000);
</script>

</body>
</html>
