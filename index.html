<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>emsly | UI Designer</title>
    <style>
        /* 1. Özel İmleç (Custom Cursor) */
        body { cursor: none; }
        .cg {
            position: fixed;
            width: 12px;
            height: 12px;
            background: rgba(255, 255, 255, 0.6);
            border-radius: 50%;
            pointer-events: none;
            z-index: 999999;
            transition: transform 0.1s ease;
            mix-blend-mode: difference;
        }

        /* 2. Renk Güncellemesi: Koyu/Siyah Tonları */
        :root {
            --bg: #030303;
            --text: #f0f0f0;
            --gl: #0a0a0a; /* Kartların yeni rengi */
            --gl2: #121212; /* Hover rengi */
            --b1: #1a1a1a;
            --b2: #333;
        }
        
        /* Orijinal CSS yapınızı buraya yapıştırın, 
           sadece .gl ve .gl:hover kısımlarını yukarıdaki root değişkenleri ile güncelledim. */
        
        .gl {
            background: var(--gl) !important;
            border: 1px solid var(--b1) !important;
            transition: .3s;
        }
        .gl:hover { background: var(--gl2) !important; border-color: var(--b2) !important; }
    </style>
</head>
<body>

<div class="cg" id="cur"></div>

<script>
    // İmleç Takibi
    document.addEventListener("mousemove", e => {
        const g = document.getElementById("cur");
        if(g) {
            g.style.left = (e.clientX - 6) + "px";
            g.style.top = (e.clientY - 6) + "px";
        }
    });

    // Kalan tüm JS kodlarınız...
</script>
</body>
</html>
